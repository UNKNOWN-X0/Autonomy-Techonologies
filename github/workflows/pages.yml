name: Deploy Study Pages

# Publishes the study website to GitHub Pages on every push to main.
# The run summary and the "github-pages" environment link straight to the live site.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Collect the site files
        # Only the web pages and their assets are published; README.md and
        # .github stay in the repo but are not part of the website.
        run: |
          mkdir _site
          cp *.html _site/
          if [ -d assets ]; then cp -r assets _site/; fi
          touch _site/.nojekyll
          ls -R _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
